# 우리 반 과제 몬스터 - 전체 실행 (PostgreSQL + Spring Boot + React/nginx)
#   1) cp .env.example .env  후 값 수정
#   2) docker compose up -d --build
#   3) http://localhost:${FRONTEND_PORT}
# DB 만 띄우고 백엔드는 IDE 에서 실행하려면: docker compose up -d db  (backend 를 local 프로필로 실행)

name: class-task-monster

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-classmonster}
      POSTGRES_USER: ${POSTGRES_USER:-classmonster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      TZ: Asia/Seoul
    ports:
      # 로컬 PC 에서만 접속 가능하도록 127.0.0.1 에 바인딩
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-classmonster}
      DB_USERNAME: ${POSTGRES_USER:-classmonster}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 .env 에 설정하세요}
      SEED_DATA: ${SEED_DATA:-false}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      TZ: Asia/Seoul
    # 외부에는 frontend(nginx)만 노출하고, /api 는 nginx 가 내부 네트워크로 전달한다.
    expose:
      - "8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  pgdata:
