# 운영(배포)용: PostgreSQL + Flyway. 접속 정보는 모두 환경 변수로 주입한다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  # 시연용 샘플 데이터가 필요할 때만 SEED_DATA=true (이미 있으면 다시 만들지 않음)
  seed-data: ${SEED_DATA:false}
