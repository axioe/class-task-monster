# 원격 공용 PostgreSQL(Supabase)에 로컬 백엔드를 붙일 때 사용
#   실행: ./gradlew bootRun --args='--spring.profiles.active=remote'
#   접속 정보는 루트 .env 의 DB_URL / DB_USERNAME / DB_PASSWORD (git 에 올라가지 않음)
#
# Supabase 연결 주소는 대시보드 [Connect] → "Session pooler" 를 사용한다.
#   - Direct connection(db.<ref>.supabase.co)은 IPv6 전용이라 학교·회사 네트워크에서 안 될 수 있음
#   - Transaction pooler(6543)는 JDBC prepared statement 와 충돌하므로 사용하지 않음
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase 무료(Nano) 풀러 연결 수가 적으므로 작게 유지
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 1
      connection-timeout: 10000
      # 풀러가 유휴 연결을 끊기 전에 먼저 교체
      max-lifetime: 600000
      keepalive-time: 120000
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  # 공용 DB 이므로 기본은 샘플 데이터 생성 안 함 (시연용으로 처음 한 번만 SEED_DATA=true)
  seed-data: ${SEED_DATA:false}
