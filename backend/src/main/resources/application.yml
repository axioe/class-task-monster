spring:
  application:
    name: class-task-monster
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  # 로컬 실행 시 프로젝트 루트(또는 backend)의 .env 를 설정값으로 읽는다. (Docker 실행 시에는 환경 변수 사용)
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

server:
  port: 8080

jwt:
  # 운영 환경에서는 반드시 환경변수 JWT_SECRET 으로 32바이트 이상 값을 지정
  secret: ${JWT_SECRET:class-task-monster-local-dev-secret-key-change-me-0123456789}
  access-token-validity-seconds: ${JWT_VALIDITY_SECONDS:43200}

app:
  timezone: Asia/Seoul
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  monster:
    energy-per-food: 1
