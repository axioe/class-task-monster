plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.classmonster'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    jjwtVersion = '0.12.6'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // 운영: 원격 PostgreSQL + Flyway 로 스키마 관리
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // 로컬 개발(dev 프로필): H2 인메모리
    runtimeOnly 'com.h2database:h2'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Docker 없이 실제 PostgreSQL 17 로 마이그레이션·통합 테스트 + 로컬 DB(localDb 태스크)
    testImplementation 'io.zonky.test:embedded-postgres:2.1.0'
    testImplementation enforcedPlatform('io.zonky.test.postgres:embedded-postgres-binaries-bom:17.11.0')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ===== 로컬 개발용 PostgreSQL (Docker·관리자 권한 불필요) =====
// 실행: ./gradlew localDb        (Ctrl+C 로 종료, 데이터는 backend/.localdb 에 유지)
// 종료: ./gradlew localDbStop    (터미널을 닫아 서버가 남아 있을 때)
// 앱:   ./gradlew bootRun --args='--spring.profiles.active=local'
tasks.register('localDb', JavaExec) {
    group = 'local development'
    description = '로컬 PostgreSQL 17 서버를 실행합니다 (루트 .env 의 POSTGRES_* 사용).'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.classmonster.devtools.LocalPostgresServer'
    workingDir = projectDir
}

tasks.register('localDbStop', JavaExec) {
    group = 'local development'
    description = '백그라운드에 남아 있는 로컬 PostgreSQL 서버를 종료합니다.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.classmonster.devtools.LocalPostgresServer'
    workingDir = projectDir
    args 'stop'
}
